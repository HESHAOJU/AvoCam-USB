name: AvoCamUSB
options:
  bundleIdPrefix: com.avocamusb
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1,2"
    INFOPLIST_FILE: AvoCamUSB/Resources/Info.plist
    ENABLE_BITCODE: NO
targets:
  AvoCamUSB:
    type: application
    platform: iOS
    sources:
      - path: AvoCamUSB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.avocamusb.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: AvoCam USB
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: 需要访问摄像头以用于 USB 虚拟摄像头直播
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 需要访问麦克风以用于 USB 虚拟摄像头直播音频
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 需要本地网络权限以通过 USB 连接电脑进行视频传输
    scheme:
      testTargets:
        - AvoCamUSBTests
  AvoCamUSBTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AvoCamUSBTests
    dependencies:
      - target: AvoCamUSB
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/AvoCamUSB.app/AvoCamUSB
