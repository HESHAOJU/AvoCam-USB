name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build (No Signing)
        run: |
          xcodebuild \
            -project AvoCamUSB.xcodeproj \
            -scheme AvoCamUSB \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AvoCamUSB.app Payload/
          zip -r AvoCamUSB.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AvoCamUSB.ipa
          path: AvoCamUSB.ipa

      - name: Upload App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: AvoCamUSB.app
          path: build/Build/Products/Release-iphoneos/AvoCamUSB.app
